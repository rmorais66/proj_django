{% include 'recipes/partials/head.html' %} 
<body class="bg-stone-50 text-stone-800 font-sans antialiased">

  <!-- Header principal com fundo creme suave e borda sutil -->
  <header class="w-full bg-amber-50/60 border-b border-stone-200/60 backdrop-blur-sm sticky top-0 z-50">
    
    <!-- Container centralizado com espaçamento responsivo -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center">
      
      <!-- Título principal -->
      <h1 class="text-xl font-bold tracking-tight">
        
        <!-- Link com efeito de transição suave no hover -->
        <a href="/" class="flex items-center gap-2.5 text-stone-800 hover:text-emerald-700 transition-colors duration-200 group">
          
          <!-- Ícone SVG de Livro de Receitas (Substituindo o FontAwesome) -->
          <svg class="w-6 h-6 text-emerald-600 group-hover:text-emerald-700 transition-colors" 
               xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
          </svg>
          
          <!-- Texto das Receitas -->
          <span class="font-serif italic text-2xl text-stone-900">
            Recipes!!! <span class="not-italic font-sans font-medium text-emerald-600 text-lg ml-1">{{ name }}</span>
          </span>
          
        </a>
      </h1>
      
    </div>
  </header>

    <!-- Container do Card (Adicione em uma grid no seu home.html) -->
<div class="max-w-sm bg-white border border-stone-200/80 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow duration-300 flex flex-col">
  
  <!-- Área da Imagem da Receita (Troque o src pela sua imagem/imagem estática) -->
  <div class="relative aspect-video w-full bg-stone-100 overflow-hidden">
    <img src="https://unsplash.com" 
         alt="Nome da Receita" 
         class="w-full h-full object-cover hover:scale-105 transition-transform duration-500 ease-out" />
    
    <!-- Badge de Categoria (Posicionado sobre a imagem) -->
    <span class="absolute top-3 left-3 bg-emerald-500 text-white text-xs font-semibold tracking-wide uppercase px-2.5 py-1 rounded-full shadow-sm">
      Almoço Saudável
    </span>
  </div>

  <!-- Conteúdo do Card -->
  <div class="p-5 flex flex-col flex-grow">
    
    <!-- Metadados: Data de Publicação -->
    <div class="flex items-center gap-1.5 text-stone-400 text-xs mb-2">
      <svg class="w-3.5 h-3.5" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
      </svg>
      <span>Publicado em 18 Set, 2026</span>
    </div>

    <!-- Título / Nome da Receita -->
    <h3 class="font-serif text-xl font-bold text-stone-900 leading-snug mb-3 hover:text-emerald-700 transition-colors">
      <a href="#">Salada de Quinoa Tropical com Abacate</a>
    </h3>

    <!-- Divisor sutil antes dos detalhes técnicos -->
    <div class="border-t border-stone-100 my-2"></div>

    <!-- Informações do Prato: Porções -->
    <div class="mt-auto pt-2 flex items-center justify-between text-stone-600 text-sm">
      <div class="flex items-center gap-2">
        <!-- Ícone de prato/porção -->
        <svg class="w-4 h-4 text-emerald-600" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
        <span class="font-medium text-stone-700">Porções por pessoa:</span>
      </div>
      <!-- Quantidade em destaque -->
      <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-0.5 rounded-md">
        2 porções
      </span>
    </div>

    <!-- Botão Ver Receita -->
    <a href="#" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm text-center py-2.5 px-4 rounded-xl transition-colors duration-200 shadow-sm shadow-emerald-600/10">
      Ver Receita completa
    </a>

  </div>
</div>


</body>
</html>
