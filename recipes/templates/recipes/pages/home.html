{% include 'recipes/partials/head.html' %} 
<body class="bg-stone-50 text-stone-800 font-sans antialiased">

  <!-- Header principal com fundo creme suave e borda sutil -->
  <header class="w-full bg-amber-50/60 border-b border-stone-200/60 backdrop-blur-sm sticky top-0 z-50">
    
    <!-- Container centralizado com espaçamento responsivo -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center">
      
      <!-- Título principal -->
      <h1 class="text-xl font-bold tracking-tight">
        
        <!-- Link com efeito de transição suave no hover -->
        <a href="/" class="flex items-center gap-2.5 text-stone-800 hover:text-emerald-700 transition-colors duration-200 group">
          
          <!-- Ícone SVG de Livro de Receitas (Substituindo o FontAwesome) -->
          <svg class="w-6 h-6 text-emerald-600 group-hover:text-emerald-700 transition-colors" 
               xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
          </svg>
          
          <!-- Texto das Receitas -->
          <span class="font-serif italic text-2xl text-stone-900">
            Recipes <span class="not-italic font-sans font-medium text-emerald-600 text-lg ml-1">{{ name }}</span>
          </span>
          
        </a>
      </h1>
      
    </div>
  </header>

</body>
</html>
